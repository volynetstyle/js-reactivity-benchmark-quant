name: Refresh benchmark results

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmark-results
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            results/latest.json
            results/latest.csv
            results/latest.md
            docs/latest-benchmark.svg
          if-no-files-found: error
      - name: Commit refreshed results to the fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest.json results/latest.csv results/latest.md docs/latest-benchmark.svg
          if git diff --cached --quiet; then
            echo "Benchmark results are unchanged"
            exit 0
          fi
          git commit -m "chore: refresh benchmark results"
          git push origin HEAD:main
